<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
  <title id="title">知识库扩展封面</title>
  <desc id="desc">一组带有分类标签的立体知识档案卡</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5ef"/><stop offset="1" stop-color="#eae8e1"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffef9"/><stop offset="1" stop-color="#f1efe7"/></linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2d2b"/><stop offset="1" stop-color="#111312"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9ff63"/><stop offset="1" stop-color="#a8e93c"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#202420" stroke-opacity=".045" stroke-width="1"/></pattern>
    <filter id="shadow" x="-30%" y="-40%" width="170%" height="190%"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#24251f" flood-opacity=".2"/></filter>
    <filter id="smallShadow" x="-30%" y="-40%" width="170%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#131511" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1120" height="630" rx="38" fill="url(#bg)"/><rect width="1120" height="630" rx="38" fill="url(#grid)"/>
  <circle cx="990" cy="86" r="154" fill="#d7ff69" opacity=".16"/><circle cx="88" cy="584" r="190" fill="#ff9a61" opacity=".1"/>
