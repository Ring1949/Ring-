    <g transform="translate(28 -5) rotate(-2 365 190)"><rect width="730" height="380" rx="32" fill="#b6a2e8" stroke="#1b1e1c" stroke-width="2"/><rect x="214" y="-18" width="142" height="44" rx="14" fill="#b6a2e8" stroke="#1b1e1c" stroke-width="2"/><text x="238" y="10" fill="#1b1e1c" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">SPACE</text></g>
    <g transform="translate(13 13)">
      <rect width="730" height="380" rx="32" fill="url(#black)" stroke="#0b0c0b" stroke-width="2"/><rect x="408" y="-18" width="154" height="44" rx="14" fill="url(#lime)" stroke="#1b1e1c" stroke-width="2"/><text x="432" y="10" fill="#171a17" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">MATERIAL</text>
      <path d="M44 74h642M44 300h642" stroke="#fff" stroke-opacity=".12"/><text x="48" y="108" fill="#d9ff63" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4">KNOWLEDGE BASE</text><text x="47" y="211" fill="#f4f3ec" font-family="Arial,'Noto Sans SC',sans-serif" font-size="76" font-weight="700">知识库</text><text x="50" y="252" fill="#f4f3ec" fill-opacity=".48" font-family="Arial,sans-serif" font-size="15" letter-spacing="4">A PERSONAL SYSTEM OF REFERENCES</text>
